{% extends "base.html" %} 
{% block title %}
{{ page_title }}
{% endblock title %}
{% block content %}
<div class="container my-5">
  <h2 class="text-center mb-5"><strong>{{ page_title }}</strong></h2>

  {% comment %} <form method="POST" class="w-100" style="max-width: 500px"> {% endcomment %}
  <form
  method="POST"
  {% comment %} Encoding type = enctype, used for file uploading {% endcomment %}
  enctype="multipart/form-data"
  action="{% if post %}{% url 'blog_update' post.pk %}{% else %}{% url 'blog_create' %}{% endif %}" class="w-100">
    {% csrf_token %} {{ form.non_field_errors }}{{ form.as_p }}
      <button type="submit" class="btn btn-success">Save Blog</button>
      <a href="{% url 'list' %}" class="btn btn-danger"> Cancel </a>
  </form>
</div>
{% endblock content %}

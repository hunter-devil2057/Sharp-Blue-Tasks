
{% extends "base.html" %}

{% block content %}
  <h2>Delete Lawyer</h2>
  <p>Are you sure you want to delete  "{{ object.first_name }} {{ object.last_name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'lawyers:lawyer_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}

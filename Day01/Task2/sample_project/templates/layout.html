{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        My First Django Project
        {% endblock %}
    </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="text-white">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'tweet_list' %}"><strong>Tweet Bar</strong></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'tweet_list' %}">Home</a>
        </li>
      </ul>
      {% if user.is_authenticated %}
        <span class="navbar-text me-3">Signed in as {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-secondary" type="submit">Log out</button></form>
      {% else %}
        <a class="btn btn-outline-primary" href="{% url 'login' %}">Log in</a>
        <a class="btn btn-primary ms-2" href="{% url 'register' %}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>

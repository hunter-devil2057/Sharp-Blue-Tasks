{% extends "base.html" %} {% block title %}Delete Blog{% endblock title %}
{%block content %}
<div class="container my-5">
  <h2>Delete Blog</h2>

  <p>Are you sure you want to delete "{{ post.title }}"?</p>

  <form method="POST">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">Yes, Delete</button>

    <a href="{% url 'BlogDetail' post.pk %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
</div>
{% endblock content %}

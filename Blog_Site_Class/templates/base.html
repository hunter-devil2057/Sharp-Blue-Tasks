{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}{% endblock title %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="navbar navbar-light bg-dark">
      <div class="container-fluid">
        <a
          class="navbar-brand mb-0 h1"
          href="{% url 'BlogList' %}"
          style="color: white; padding-left: 40px"
          ><strong>MyBlog</strong></a
        >

        <form class="d-flex" action="{% url 'Search' %}">
          <input
            class="form-control me-2"
            type="search"
            placeholder="Search"
            name="q"
            aria-label="Search"
          />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>
        <a href="{% url 'CreateBlog' %}" class="btn btn-info ms-3">Add Blog</a>
      </div>
    </nav>

    <main class="site-content">{% block content %} {% endblock content %}</main>

    <footer class="bg-dark text-white text-center py-3">
      <p class="mb-0">&copy; 2025 MyBlog. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

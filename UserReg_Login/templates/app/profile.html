
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
</head>
<body>
    <h1>Welcome, {{user.first_name}} to User Profile</h1>

    {% if messages %}
        {% for message in messages %}
            <small
                {% if message.tags %}
                    class="{{ message.tags }}"
                {% endif %}
            >
                {{ message }}
            </small>
        {% endfor %}
    {% endif %}

    <br/>

    <form method="POST" action="{% url 'apps:logout' %}">
        {% csrf_token %}
        <button type="submit">Log Out</button>
    </form>

</body>
</html>

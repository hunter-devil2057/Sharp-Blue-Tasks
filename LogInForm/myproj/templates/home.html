<!doctype html>
<html>
  <head>
    <title>Home</title>
  </head>
  <body>
    <h1>Home Page</h1>
    {% if user.is_authenticated %}
    <h2>Welcome, {{ user.username }}!</h2>
    <p>You are logged in.</p>
    <a href="{% url 'dashboard' %}"> Dashboard </a>
    <br /><br />
    <a href="{% url 'logout' %}"> Logout </a>
    {% else %}
    <p>You are not logged in.</p>
    <a href="{% url 'login' %}"> Login </a>
    {% endif %}
  </body>
</html>

<!doctype html>
<html>
  <head>
    <title>Login</title>
  </head>
  <body>
    <h1>Login</h1>

    {% if form.errors %}
    <p style="color: red">Invalid username or password. Please try again.</p>
    {% endif %}

    <form method="POST">
      {% csrf_token %} {{ form.as_p }}

      <button type="submit">Login</button>
    </form>
  </body>
</html>
